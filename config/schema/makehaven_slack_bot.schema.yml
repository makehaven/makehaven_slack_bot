makehaven_slack_bot.settings:
  type: config_object
  label: 'MakeHaven Slack Bot Settings'
  mapping:
    enabled:
      type: boolean
      label: 'Answer questions in Slack'
    allowed_slack_users:
      type: sequence
      label: 'Only answer these Slack user IDs (empty = everyone)'
      sequence:
        type: string
        label: 'Slack user ID'
    open_dms:
      type: boolean
      label: 'Answer DMs from any linked member (mentions stay on the list)'
    daily_cap:
      type: integer
      label: 'Questions per person per day (0 = no cap)'
    assistant_id:
      type: string
      label: 'AI assistant that answers'
    signing_secret:
      type: string
      label: 'Slack Signing Secret'
    bot_token:
      type: string
      label: 'Red Robot bot token'
