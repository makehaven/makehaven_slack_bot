services:
  makehaven_slack_bot.tool_page_context_subscriber:
    class: Drupal\makehaven_slack_bot\EventSubscriber\ToolPageContextSubscriber
    arguments:
      - '@entity_type.manager'
      - '@request_stack'
    tags:
      - { name: event_subscriber }
  makehaven_slack_bot.answerer:
    class: Drupal\makehaven_slack_bot\Service\SlackAnswerer
    arguments:
      - '@config.factory'
      - '@entity_type.manager'
      - '@ai.provider'
      - '@event_dispatcher'
      - '@request_stack'
      - '@account_switcher'
      - '@http_client'
      - '@logger.factory'
    tags:
      - { name: needs_destruction }
